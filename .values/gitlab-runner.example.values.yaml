# Copy to .values/gitlab-runner.values.yaml and adjust if needed.
# Do not put runner authentication tokens in this file; pass them with
# GITLAB_RUNNER_TOKEN or GITLAB_RUNNER_TOKEN_FILE when running deploy_runner.sh.

# Runner pods run inside Kubernetes, where 127.0.0.1 means the pod itself.
# Use the in-cluster GitLab webservice URL for runner registration.
gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181

rbac:
  create: true

serviceAccount:
  create: true

concurrent: 4
checkInterval: 3

runners:
  name: local-kubernetes-runner
  tags: "k8s,local"
  runUntagged: false
  locked: true
  cache:
    secretName: gitlab-runner-garage-cache
  config: |
    [[runners]]
      # Keep enough GitLab long-poll requests open to promptly claim work for
      # all available build slots. The default of 1 can delay queued jobs.
      request_concurrency = 4
      clone_url = "http://gitlab-webservice-default.gitlab.svc.cluster.local:8181"
      [runners.kubernetes]
        namespace = "gitlab"
        image = "RUNNER_JOB_IMAGE"
        # Always resolve the promoted rolling tag for each new job pod.
        pull_policy = ["always"]
        image_pull_secrets = ["gitlab-registry-pull"]
        privileged = false
        poll_timeout = 180
        cpu_request = "100m"
        memory_request = "256Mi"
        helper_cpu_request = "50m"
        helper_memory_request = "128Mi"
        [[runners.kubernetes.host_aliases]]
          ip = "GITLAB_INGRESS_CLUSTER_IP"
          # deploy_runner.sh fills this with the GitLab webservice ingress
          # and registry ingress hostnames for the selected GitLab TLS profile.
          hostnames = ["GITLAB_EXTERNAL_HOSTNAME", "GITLAB_EXTERNAL_REGISTRY_HOST"]
        # The registry challenges Docker to obtain a token from the HTTPS
        # GitLab ingress.  Mount its mkcert certificate for the build and
        # service containers, including docker:dind.
        [[runners.kubernetes.volumes.secret]]
          name = "GITLAB_TLS_SECRET"
          mount_path = "/etc/ssl/certs/gitlab-local.pem"
          sub_path = "tls.crt"
          read_only = true
      [runners.cache]
        # GitLab Runner names this cache backend "s3"; here it points to Garage,
        # the in-cluster S3-compatible object store, not AWS S3.
        Type = "s3"
        Path = "runner"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "dev-garage.gitlab.svc.cluster.local:3900"
          BucketName = "runner-cache"
          BucketLocation = "garage"
          Insecure = true
          AuthenticationType = "access-key"
